name: 24-7 Autonomous Gaming Shorts & Heatmap Scheduler

on:
  schedule:
    - cron: "0 */4 * * *"

  workflow_dispatch:
    inputs:
      stream_url:
        description: "Optional specific URL (leave blank for 24/7 auto-discovery)"
        required: false
        default: ""
      topic_niche:
        description: "Topic/Niche for SEO ('auto' to detect from stream, or e.g. 'GTA 6')"
        required: false
        default: "auto"
      slice_minutes:
        description: "Minutes of live stream to record per cycle (10-15 recommended)"
        required: false
        default: "12"
      max_clips:
        description: "Maximum Shorts to render and schedule per cycle"
        required: false
        default: "1"
      layout:
        description: "Vertical 9:16 framing (blur | zoom | crop)"
        required: false
        default: "blur"
      style:
        description: "Caption style (auto = AI picks per clip | vice_hype | cyber_gold | rage_neon | clean_pro)"
        required: false
        default: "auto"

concurrency:
  group: gta6-shorts-24x7-pipeline
  cancel-in-progress: false

jobs:
  autonomous-clip-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GDRIVE_INBOX_FOLDER_ID: ${{ secrets.GDRIVE_INBOX_FOLDER_ID }}
      GDRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GDRIVE_OUTPUT_FOLDER_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      YT_PROXY: ${{ secrets.YT_PROXY }}
      YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      POST_GAP_HOURS: "4"
      MAX_DAILY_YT: "3"
      MAX_DAILY_FB: "2"
      MAX_DAILY_IG: "2"
      MIN_VIRAL_SCORE: "72"
      TOPIC_NICHE: ${{ github.event.inputs.topic_niche || vars.TOPIC_NICHE || 'auto' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg, fonts, and Deno JS runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-noto-core unzip
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Sherpa-ONNX Parakeet 0.6B speech model & 24/7 State Ledger
        uses: actions/cache@v4
        with:
          path: |
            models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
            work/bot_state_ledger.json
          key: sherpa-and-state-${{ github.run_number }}
          restore-keys: |
            sherpa-and-state-

      - name: Download Sherpa-ONNX model if not cached and GROQ_API_KEY is unset
        if: env.GROQ_API_KEY == ''
        run: |
          if [ ! -f "models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8/tokens.txt" ]; then
            mkdir -p models
            curl -L -o models/model.tar.bz2               "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8.tar.bz2"
            tar -xjf models/model.tar.bz2 -C models/
            rm -f models/model.tar.bz2
          fi

      - name: Restore optional YouTube cookies (if configured in Secrets)
        run: |
          if [ -n "$YT_COOKIES_B64" ]; then
            echo "$YT_COOKIES_B64" | base64 -d > "$RUNNER_TEMP/yt_cookies.txt"
            echo "YT_COOKIES_FILE=$RUNNER_TEMP/yt_cookies.txt" >> $GITHUB_ENV
          fi

      - name: Run 24/7 Autonomous Discovery, Analytics Heatmap Update, Clipping & Scheduling
        run: |
          python3 stream_clipper.py             --auto-24x7             --url "${{ github.event.inputs.stream_url || '' }}"             --topic "${{ github.event.inputs.topic_niche || 'auto' }}"             --slice-minutes "${{ github.event.inputs.slice_minutes || '12' }}"             --max-clips "${{ github.event.inputs.max_clips || '1' }}"             --layout "${{ github.event.inputs.layout || 'blur' }}"             --style "${{ github.event.inputs.style || 'auto' }}"             --isolate-voice             --save-to-drive             --schedule
