name: Daily YouTube Vertical Live (9-16 Shorts Feed)

on:
  # Runs daily at 8:05 PM PKT (15:05 UTC) during peak Golden Hours
  schedule:
    - cron: "5 15 * * *"

  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Minutes to broadcast live (e.g. 10 for quick test, 180 for 3-hour evening session)"
        required: false
        default: "180"
      max_clips:
        description: "Number of latest Drive Shorts to loop"
        required: false
        default: "15"

concurrency:
  group: razongamerz-vertical-live
  cancel-in-progress: false

jobs:
  vertical-live-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GDRIVE_OUTPUT_FOLDER_ID: ${{ secrets.GDRIVE_OUTPUT_FOLDER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-noto-core

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Go Live on YouTube Vertical Shorts Feed (9:16)
        run: |
          python3 vertical_live_streamer.py \
            --duration-minutes "${{ github.event.inputs.duration_minutes || '180' }}" \
            --max-clips "${{ github.event.inputs.max_clips || '15' }}" \
            --rotate-minutes 60
